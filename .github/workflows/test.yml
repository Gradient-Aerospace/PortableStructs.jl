name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - julia-version: '1.10'
            julia-arch: x64
            os: ubuntu-latest
          - julia-version: '1.11'
            julia-arch: x64
            os: ubuntu-latest
          - julia-version: '1.12'
            julia-arch: x64
            os: ubuntu-latest
          - julia-version: '1.12'
            julia-arch: x64
            os: windows-latest
          - julia-version: '1.12'
            julia-arch: aarch64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
